name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ha:
    name: Home Assistant & HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS
        uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Ruff check
        run: uvx ruff check .

      - name: Ruff format
        run: uvx ruff format --check .

      - name: mypy
        run: uv run --with mypy --with homeassistant mypy custom_components/rotel_control

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Run tests
        run: |
          uv pip install -r requirements_test.txt
          uv run pytest tests/ -v

  version-check:
    name: Manifest version increment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check version increment
        run: |
          set -e
          TARGET_BRANCH="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          MANIFEST="custom_components/rotel_control/manifest.json"
          OLD_VER=$(git show "$TARGET_BRANCH:$MANIFEST" 2>/dev/null | grep '"version"' | head -n1 || echo "")
          NEW_VER=$(grep '"version"' "$MANIFEST" | head -n1 || echo "")
          if [ -z "$OLD_VER" ] || [ -z "$NEW_VER" ]; then
            echo "Could not determine versions"
            exit 1
          fi
          if [ "$OLD_VER" = "$NEW_VER" ]; then
            echo "Version in manifest.json must be incremented for each PR (see AGENTS.md)"
            exit 1
          fi
