name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate-ha:
    name: Home Assistant & HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS
        uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Ruff check
        run: uvx ruff check .

      - name: Ruff format
        run: uvx ruff format --check .

      - name: mypy
        run: uv run --with mypy --with homeassistant mypy custom_components/rotel_control

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run tests with coverage
        run: python -m pytest --cov=custom_components/rotel_control --cov-report=json tests/ -v

      - name: Extract coverage
        id: coverage
        run: |
          COVERAGE=$(jq '.totals.percent_covered_display' coverage.json | tr -d '"')
          echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Commit coverage badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COVERAGE="${{ steps.coverage.outputs.coverage }}"
          if [ "$COVERAGE" = "null" ] || [ -z "$COVERAGE" ]; then
            COVERAGE="0"
          fi
          if [ "$COVERAGE" -ge 80 ]; then
            COLOR="green"
          elif [ "$COVERAGE" -ge 50 ]; then
            COLOR="yellow"
          else
            COLOR="red"
          fi
          cat > coverage-badge.json <<EOF
          {
            "schemaVersion": 1,
            "label": "Coverage",
            "message": "${COVERAGE}%",
            "color": "${COLOR}"
          }
          EOF
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add coverage-badge.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update coverage badge to ${COVERAGE}%"
          fi
          git push --force origin HEAD:refs/heads/coverage-badge || echo "badge push skipped"

  version-check:
    name: Manifest version increment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check version increment
        run: |
          set -e
          TARGET_BRANCH="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 || true
          MANIFEST="custom_components/rotel_control/manifest.json"
          OLD_VER=$(git show "$TARGET_BRANCH:$MANIFEST" 2>/dev/null | grep '"version"' | head -n1 || echo "")
          NEW_VER=$(grep '"version"' "$MANIFEST" | head -n1 || echo "")
          if [ -z "$OLD_VER" ] || [ -z "$NEW_VER" ]; then
            echo "Could not determine versions"
            exit 1
          fi
          if [ "$OLD_VER" = "$NEW_VER" ]; then
            echo "Version in manifest.json must be incremented for each PR (see AGENTS.md)"
            exit 1
          fi
