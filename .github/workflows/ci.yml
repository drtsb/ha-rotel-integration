name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  hassfest:
    name: Home Assistant & HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS
        uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Ruff check
        run: ruff check custom_components

      - name: Ruff format
        run: ruff format --check custom_components

      - name: mypy
        run: mypy custom_components --ignore-missing-imports --follow-imports=silent

  version-check:
    name: Manifest version increment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version increment
        run: |
          set -e
          base="${{ github.base_ref }}"
          git fetch origin "$base" --depth=1
          if git diff --quiet "origin/$base" -- custom_components/rotel/manifest.json; then
            echo "Version in manifest.json must be incremented for each PR (see AGENTS.md)"
            exit 1
          fi
          base_ver=$(git show "origin/$base:custom_components/rotel/manifest.json" | python -c 'import sys,json; print(json.load(sys.stdin)["version"])')
          head_ver=$(python -c 'import json; print(json.load(open("custom_components/rotel/manifest.json"))["version"])')
          if [ "$base_ver" = "$head_ver" ]; then
            echo "Version in manifest.json must be incremented for each PR (see AGENTS.md)"
            exit 1
          fi
