name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-ha:
    name: Home Assistant & HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: hassfest
        uses: home-assistant/actions/hassfest@master

      - name: HACS
        uses: hacs/action@main
        with:
          category: integration

  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Ruff check
        run: uvx ruff check .

      - name: Ruff format
        run: uvx ruff format --check .

      - name: mypy
        run: uv run --with mypy --with homeassistant mypy custom_components/rotel_control

  version-check:
    name: Manifest version increment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version increment
        run: |
          set -e
          base="${{ github.base_ref }}"
          git fetch origin "$base" --depth=1
          if git diff --quiet "origin/$base" -- custom_components/rotel_control/manifest.json; then
            echo "Version in manifest.json must be incremented for each PR (see AGENTS.md)"
            exit 1
          fi
          base_ver=$(git show "origin/$base:custom_components/rotel_control/manifest.json" | python -c 'import sys,json; print(json.load(sys.stdin)["version"])')
          head_ver=$(python -c 'import json; print(json.load(open("custom_components/rotel_control/manifest.json"))["version"])')
          if [ "$base_ver" = "$head_ver" ]; then
            echo "Version in manifest.json must be incremented for each PR (see AGENTS.md)"
            exit 1
          fi
